const env = [];
env.push("打开方式：" + ((navigator.standalone || matchMedia("(display-mode: standalone)").matches) ? "桌面图标（独立模式）" : "浏览器"));
env.push("audioSession：" + (navigator.audioSession ? "支持（已设为 playback）" : "不支持"));
try{ if(navigator.audioSession) navigator.audioSession.type = "playback"; }catch(e){}
const m = navigator.userAgent.match(/OS (\d+)_(\d+)/); env.push("系统：" + (m ? "iOS " + m[1] + "." + m[2] : navigator.userAgent.slice(0, 80)));
document.getElementById("env").innerHTML = env.map(x => "<div>" + x + "</div>").join("");
function test(src, out){
  const r = document.getElementById(out); r.className = "r"; r.textContent = "正在播放…";
  const a = new Audio(); a.src = src;
  a.onended = () => { r.className = "r ok"; r.textContent += " ✓ 播完了（听到声音了吗？）"; };
  a.onerror = () => { r.className = "r bad"; r.textContent = "✗ 加载失败（错误码 " + (a.error && a.error.code) + "）"; };
  const p = a.play(); if(p) p.then(() => { r.textContent = "▶ 已开始播放"; }).catch(e => { r.className = "r bad"; r.textContent = "✗ 播放被拒绝：" + e.name; });
}
const bytes = () => Uint8Array.from(atob(B64), c => c.charCodeAt(0));
document.getElementById("b1").onclick = () => test("audiotest.mp3?" + Date.now(), "r1");
document.getElementById("b2").onclick = () => test("data:audio/mpeg;base64," + B64, "r2");
document.getElementById("b3").onclick = () => test(URL.createObjectURL(new Blob([bytes()], {type: "audio/mpeg"})), "r3");
document.getElementById("b4").onclick = () => {
  const r = document.getElementById("r4");
  try{ const C = window.AudioContext || window.webkitAudioContext; const c = new C(); const o = c.createOscillator(); o.frequency.value = 660; o.connect(c.destination); o.start(); o.stop(c.currentTime + 0.4);
    c.resume().then(() => { r.className = "r ok"; r.textContent = "▶ 已发出“嘀”（状态：" + c.state + "）"; }); }
  catch(e){ r.className = "r bad"; r.textContent = "✗ " + e.name; }
};
</script></body></html>
