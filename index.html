<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>英文原书图书馆</title><link rel="manifest" href="/mystory/manifest.webmanifest"><meta name="theme-color" content="#1f3b57"><link rel="apple-touch-icon" href="/mystory/icons/apple-touch-icon.png"><link rel="icon" href="/mystory/icons/icon-192.png"><meta name="apple-mobile-web-app-title" content="原书共读">
<style>
:root{
  --bg:#f5f6f8; --paper:#ffffff; --ink:#1b2333; --muted:#5d6678; --line:#dde1e8;
  --accent:#2747b8; --accent-soft:#e6ebfb; --ok:#1f7a4d; --ok-soft:#e3f4ea;
  --display:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Songti SC","STSong",serif;
  --body:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161f; --paper:#1a2030; --ink:#e7eaf2; --muted:#9aa3b6; --line:#2c3447;
  --accent:#8aa2ff; --accent-soft:#232c4a; --ok:#6fd39f; --ok-soft:#173326; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161f; --paper:#1a2030; --ink:#e7eaf2; --muted:#9aa3b6; --line:#2c3447;
  --accent:#8aa2ff; --accent-soft:#232c4a; --ok:#6fd39f; --ok-soft:#173326; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;padding:0 16px}
.wrap{max-width:860px;margin:0 auto;padding-block:28px 80px}
h1,h2,h3{font-family:var(--display);line-height:1.2;margin:0}
h1{font-size:clamp(28px,6vw,40px)}
p{margin:0}
[hidden]{display:none!important}
.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:600}
.lede{color:var(--muted);margin-top:8px}
.note{font-size:14px;color:var(--muted)}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:22px;margin-top:16px}
.btn{font:600 15px var(--body);background:var(--accent);color:var(--paper);border:0;border-radius:8px;padding:9px 16px;cursor:pointer;min-height:40px}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--accent)}
.btn.small{font-size:13px;padding:5px 10px;min-height:32px}
#lock{min-height:80vh;display:flex;align-items:center}
#lock .panel{width:100%;max-width:440px;margin:0 auto;padding:28px}
#code{width:100%;font:600 20px var(--body);letter-spacing:.08em;text-transform:uppercase;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);margin-top:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:22px}
.book{display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden;color:inherit;text-decoration:none;transition:transform .15s,box-shadow .15s}
a.book:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(20,30,60,.12)}
.cover{aspect-ratio:3/4;padding:16px 14px;display:flex;flex-direction:column;justify-content:space-between;position:relative}
.cover .t{font-family:var(--display);font-size:clamp(17px,4.6vw,23px);line-height:1.15;font-weight:600}
.cover .a{font-size:12px;letter-spacing:.06em;opacity:.85}
.cover .rule{width:44px;height:3px;border-radius:2px;background:currentColor;opacity:.7;margin:14px 0}
.cover .lockico{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:36px;background:rgba(20,24,34,.45)}
.cover .jc{position:absolute;right:12px;top:12px;font:600 9px var(--body);letter-spacing:.22em;opacity:.45}
.meta{padding:12px 12px 14px}
.meta b{font-family:var(--display);font-size:15px;line-height:1.3;display:block}
.bar{height:6px;border-radius:99px;background:var(--line);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.tag{display:inline-block;font:600 12px var(--body);border-radius:999px;padding:2px 9px;margin-top:8px}
.tag.go{background:var(--ok-soft);color:var(--ok)} .tag.new{background:var(--accent-soft);color:var(--accent)} .tag.off{background:var(--line);color:var(--muted)}
.book.locked{opacity:.75;cursor:default}
.demo{background:#fff3d6;color:#8a5a00;border-radius:8px;padding:8px 12px;font-size:14px;margin-top:14px}
@media (prefers-color-scheme: dark){.demo{background:#3a2f12;color:#f3c66b}}
/* Journey brand banner (library home) */
.jhero{margin:0 -16px 26px;padding:34px 22px 30px;background:linear-gradient(135deg,#1f3b57 0%,#2c5378 60%,#3a6a8f 100%);color:#f6ead0;position:relative;overflow:hidden}
.jhero:after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;border:1px solid rgba(241,220,174,.25)}
.jhero .t{font:600 44px/1 var(--display);letter-spacing:.01em}
.jhero .s{margin-top:10px;font:500 16px var(--body);letter-spacing:.18em;color:#f1dcae}
.jhero .r{width:46px;height:2px;background:#f1dcae;opacity:.7;margin:18px 0 14px}
.jhero .d{font-size:14px;opacity:.85}
#lib{padding-top:0}
@media(min-width:900px){#lib{padding-top:28px}.jhero{margin:0 0 26px;border-radius:16px}}
/* KIDHOME: the 体验码 sees a bright kids' home */
body.kids{--bg:#fff8ec;--paper:#fff;--ink:#3a2c1c;--muted:#8a7660;--line:#f0e2c8;--body:"Nunito","Arial Rounded MT Bold","PingFang SC","Noto Sans SC",system-ui,sans-serif;--display:var(--body);color-scheme:light}
body.kids .jhero{background:linear-gradient(135deg,#ffb347 0%,#ff8a5c 55%,#ff6f91 100%);color:#fff;padding:30px 22px 26px;border-radius:0 0 30px 30px}
body.kids .jhero:after{display:none}
.lr .t{font:700 46px/1 "Fredoka","Baloo 2","Arial Rounded MT Bold",sans-serif;letter-spacing:.01em;text-shadow:0 3px 0 rgba(160,60,30,.35)}
.lr .s{margin-top:8px;font:400 26px/1.2 "ZCOOL KuaiLe","Fredoka","PingFang SC",sans-serif;letter-spacing:.12em;color:#fff8d6}
.lr .d{margin-top:12px;font:600 15px var(--body);opacity:.95}
.lr .ic{position:absolute;font-size:28px;opacity:.9}
.lr .badge{display:inline-flex;align-items:center;justify-content:center;width:58px;height:58px;border-radius:50%;background:#fff;font-size:34px;box-shadow:0 4px 0 rgba(160,60,30,.3);margin-bottom:12px}
@media(min-width:900px){body.kids .jhero{border-radius:30px}}
body.kids #hello{font-weight:900}
body.kids .eyebrow{color:#e8673a}
.kstars{display:inline-block;background:#fff;border:3px solid #ffc93c;border-radius:999px;padding:6px 16px;font-size:22px;font-weight:900;box-shadow:0 4px 0 #f2b41d;margin-top:12px}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;margin-top:22px}
.kbook{border-radius:26px;padding:20px 18px 18px;color:#fff;min-height:260px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 8px 0 rgba(0,0,0,.12);text-decoration:none;transition:transform .15s}
.kbook:hover{transform:translateY(-3px)}
.kbook .lv{display:inline-block;background:rgba(255,255,255,.9);color:#3a2c1c;font-weight:800;font-size:13px;border-radius:999px;padding:3px 10px;margin-bottom:8px}
.kbook .emo{font-size:64px;line-height:1}
.kbook b{font-size:24px;line-height:1.15;display:block;margin-top:10px}
.kbook .zh{font-size:16px;opacity:.95;margin-top:4px}
.kbook .kbar{height:12px;background:rgba(255,255,255,.35);border-radius:99px;overflow:hidden;margin-top:14px}
.kbook .kbar i{display:block;height:100%;background:#fff;border-radius:99px}
.kbook .go{margin-top:12px;background:#fff;color:#3a2c1c;font-weight:900;font-size:18px;border-radius:999px;padding:9px 0;text-align:center}
.ktip{margin-top:24px;background:#fff;border-radius:20px;padding:16px 18px;font-size:17px;border:3px dashed var(--line)}
</style>
</head>

    <p class="lede">一起读英文原书 · 朗读 · 生词讲解 · 复习</p>

</div>

  <p class="eyebrow">English Reading Club · 英文原书图书馆</p>

</div>

    <input id="nameIn" maxlength="30" autocomplete="name" placeholder="你的名字或昵称" style="width:100%;font:600 18px var(--body);padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);margin-top:12px">
    <div style="margin-top:12px"><button class="btn" id="nameOk" disabled>开始我的阅读之旅 →</button></div>
  </div>
</div>

const $ = id => document.getElementById(id);
const LKEY = "er:code:library";
function sget(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function sset(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
function sdel(k){ try{ localStorage.removeItem(k); }catch(e){} }
const b64u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function opens(book, code){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
  const HK = "er:ks:" + book.id, hint = sget(HK);   // try last time's key first; the book page then opens fast too
  const order = book.keys.filter(k => k.s === hint).concat(book.keys.filter(k => k.s !== hint));
  for(const k of order){
    try{
      const kek = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64u8(k.s), iterations:book.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
      const raw = new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM", iv:b64u8(k.iv)}, kek, b64u8(k.k)));
      sset(HK, k.s);
      return new TextDecoder().decode(raw.slice(32)) || "reader";
    }catch(e){}
  }
  return false;
}
async function unlock(code, silent){
  code = (code || "").trim().toUpperCase().replace(/\s+/g, "");
  if(!code) return;
  $("msg").textContent = silent ? "" : "正在验证…"; $("unlock").disabled = true;
  try{
    const ok = [];
    for(const b of BOOKS){ const l = await opens(b, code); if(l){ ok.push(b.id); if(l === "体验码") KID = true; } }
    if(!ok.length){ $("msg").textContent = silent ? "" : "授权码不对，请检查后再试。"; return; }
    sset(LKEY, code);
    OWNER = [...new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(code)))].map(b => b.toString(16).padStart(2, "0")).join("").slice(0, 12);
    ok.forEach(id => sset("er:code:" + id, code));     // the book's own shelf then opens without asking again
    show(ok);
    checkName(code, ok);
  }finally{ $("unlock").disabled = false; }
}
let OWNER = "", KID = false;
/* first login: ask the name right here (once per code). The name is saved into each book's progress on this phone;
   the book page sends it to the cloud the first time it opens. If the cloud already has a name (new phone), use that. */
const SYNC = "https://script.google.com/macros/s/AKfycbwDjpFXxa2ithrjWHhUEwECpTBN_FNGO3qA7asnyrwDOfX0IhWxXj7ZhjLdHtvVrqEj/exec";
async function sha(s){ return [...new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s.trim().toUpperCase().replace(/\s+/g, ""))))].map(b => b.toString(16).padStart(2, "0")).join(""); }
function putName(ids, name){ ids.forEach(id => { const p = prog(id); if(!p.name){ p.name = name; p.days = p.days || {}; p.words = p.words || {}; sset("er:" + id + ":" + OWNER, JSON.stringify(p)); } }); }
async function checkName(code, ids){
  if(ids.some(id => prog(id).name)){ const n = ids.map(id => prog(id).name).find(Boolean); putName(ids, n); return; }
  let cloud = "";
  if(SYNC.startsWith("http")){
    await Promise.all(ids.map(async id => {
      try{
        const ac = new AbortController(), tm = setTimeout(() => ac.abort(), 5000);
        const t = await sha(id === "my-story-mbr" ? code : code + "|" + id);
        const j = await fetch(SYNC + "?t=" + t + "&b=" + encodeURIComponent(id), {signal: ac.signal}).then(r => r.json()); clearTimeout(tm);
        if(j && j.data && j.data.name && !cloud) cloud = j.data.name;
      }catch(e){}
    }));
  }
  if(cloud){ putName(ids, cloud); show(ids); return; }
  const box = $("nameAsk"), inp = $("nameIn"), ok = $("nameOk");
  box.hidden = false; box.style.display = "flex";
  inp.oninput = () => { ok.disabled = !inp.value.trim(); };
  const go = () => { const v = inp.value.trim().slice(0, 30); if(!v) return; putName(ids, v); box.hidden = true; box.style.display = "none"; show(ids); };
  ok.onclick = go; inp.onkeydown = e => { if(e.key === "Enter") go(); };
  setTimeout(() => inp.focus(), 50);
}
function prog(id){ try{ return JSON.parse(sget("er:" + id + ":" + OWNER) || "{}") || {}; }catch(e){ return {}; } }   // progress is stored per code
function kidShow(ok){
  document.body.classList.add("kids");
  if(!document.getElementById("lrFont")){ const l = document.createElement("link"); l.id = "lrFont"; l.rel = "stylesheet"; l.href = "https://fonts.googleapis.com/css2?family=Fredoka:wght@700&family=ZCOOL+KuaiLe&display=swap"; document.head.appendChild(l); }
  const hero = document.querySelector(".jhero"); hero.classList.add("lr");
  hero.innerHTML = '<div class="badge">📚</div><div class="t">Little Readers</div><div class="s">小小读书家</div><div class="d">每天一个英文小故事 ✏️</div>'
    + '<span class="ic" style="right:22px;top:18px">⭐</span><span class="ic" style="right:70px;top:58px;font-size:22px">🌈</span><span class="ic" style="right:26px;bottom:18px">🚀</span><span class="ic" style="right:96px;bottom:30px;font-size:20px">✨</span>';
  document.querySelector("#lib > .eyebrow").textContent = "LITTLE READERS · 小小读书家";
  document.title = "Little Readers 小小读书家";
  $("lock").hidden = true; $("lib").hidden = false;
  const name = BOOKS.map(b => prog(b.id).name).find(Boolean);
  $("hello").textContent = (name ? name + "，" : "") + "你好！🐯";
  const kb = BOOKS.filter(b => (b.kids || b.kidReader) && ok.includes(b.id)).sort((x, y) => (x.level || 9) - (y.level || 9));   // easy → hard
  const firstOpen = kb.find(b => Object.values(prog(b.id).days || {}).filter(d => d && d.done).length < b.published);
  let stars = 0;
  kb.forEach(b => Object.values(prog(b.id).days || {}).forEach(d => { if(d && d.done) stars += 1 + (d.star2 ? 1 : 0); }));
  $("libLede").innerHTML = '今天也来读一个故事吧 · 书从简单到难排好了<br><span class="kstars">⭐ ' + stars + '</span>';
  const g = $("grid"); g.className = "kgrid"; g.innerHTML = "";
  kb.forEach(b => {
    const days = prog(b.id).days || {}, done = Object.values(days).filter(d => d && d.done).length;
    const next = done + 1;
    const el = document.createElement("a"); el.className = "kbook"; el.href = b.url;
    el.style.background = "linear-gradient(160deg," + b.bg2 + "," + (b.kbg || b.bg) + ")";
    el.innerHTML = '<div><div class="lv"></div><div class="emo"></div><b></b><div class="zh"></div></div><div><div class="kbar"><i style="width:' + (100 * done / b.total) + '%"></i></div><div class="go"></div></div>';
    el.querySelector(".emo").textContent = b.emo || "📖";
    el.querySelector(".lv").textContent = "难度 " + (b.lvText || "") + (b === firstOpen ? " · 👉 先读这本" : ""); el.querySelector("b").textContent = b.title;
    el.querySelector(".zh").textContent = (b.zh || "") + " · " + b.total + " 天" + (done ? " · 读完 " + done + " 天" : "");
    el.querySelector(".go").textContent = done ? (next > b.published ? "新故事快来了 🛠️" : "接着读 Day " + next + " →") : "开始读 →";
    g.appendChild(el);
  });
  document.querySelectorAll(".ktip").forEach(e => e.remove());
  const t = document.createElement("div"); t.className = "ktip"; t.textContent = "💡 每读完一天得 1 颗 ⭐，把当天的新单词一次全拼对，再得 1 颗 ⭐！每天还会学几个“常用词”。"; g.after(t);
}
function show(ok){
  if(KID) return kidShow(ok);
  $("lock").hidden = true; $("lib").hidden = false;
  const name = BOOKS.map(b => prog(b.id).name).find(Boolean);
  $("hello").textContent = name ? name + "，欢迎回来 👋" : "欢迎来到图书馆 👋";
  $("libLede").textContent = "你可以读 " + ok.length + " 本书。点开一本，继续今天的阅读。";
  if(DEMO){ $("demoNote").hidden = false; $("demoNote").textContent = DEMO; }
  const g = $("grid"); g.innerHTML = "";
  BOOKS.filter(b => !b.kids || ok.includes(b.id)).forEach(b => {
    const can = ok.includes(b.id), p = prog(b.id), days = p.days || {};
    const done = Object.values(days).filter(d => d && d.done).length;
    const el = document.createElement(can ? "a" : "div");
    el.className = "book" + (can ? "" : " locked");
    if(can) el.href = b.url;
    const tag = !can ? '<span class="tag off">未开通</span>' : done ? '<span class="tag go">继续阅读 →</span>' : '<span class="tag new">开始阅读 →</span>';
    el.innerHTML = `
      <div class="cover" style="background:${b.bg};color:${b.fg}">
        <div><div class="t">${b.title}</div><div class="rule"></div><div class="a">${b.author}</div></div>
        <div class="a">${b.total} 天 · ${b.perDay || "每天一章"}</div>
        <span class="jc">JOURNEY</span>
        ${can ? "" : '<div class="lockico">🔒</div>'}
      </div>
      <div class="meta">
        <b>${b.title}</b>
        <p class="note">${can ? "已完成 " + done + " / " + b.total + " 天 · 已更新到 Day " + b.published : "需要授权码才能打开，请联系发书人"}</p>
        ${can ? `<div class="bar"><i style="width:${100 * done / b.total}%"></i></div>` : ""}
        ${tag}
      </div>`;
    g.appendChild(el);
  });
}
$("unlock").onclick = () => unlock($("code").value);
$("code").addEventListener("keydown", e => { if(e.key === "Enter") unlock($("code").value); });
$("logout").onclick = () => { sdel(LKEY); BOOKS.forEach(b => sdel("er:code:" + b.id)); location.reload(); };
const saved = sget(LKEY) || BOOKS.map(b => sget("er:code:" + b.id)).find(Boolean) || sget("er:code:my-story-mbr"); if(saved){ $("code").value = saved; unlock(saved, true); }
</script>
